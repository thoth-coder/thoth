[package]
name = "thoth"
version = "0.1.0"
edition = "2024"
description = "Agentic coding assistant for local LLMs (Ollama / llama.cpp)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/thoth-coder/thoth"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
futures-util = "0.3"
globset = "0.4"
ratatui = "0.29"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "charset", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
textwrap = "0.16"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "signal"] }
tokio-util = "0.7"
toml = "0.8"
unicode-width = "0.2"
walkdir = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
