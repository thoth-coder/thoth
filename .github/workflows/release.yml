name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          NAME="thoth-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$NAME"
          cp "target/${{ matrix.target }}/release/thoth" README.md LICENSE-MIT LICENSE-APACHE "$NAME/"
          tar -czf "$NAME.tar.gz" "$NAME"
          (sha256sum "$NAME.tar.gz" 2>/dev/null || shasum -a 256 "$NAME.tar.gz") > "$NAME.tar.gz.sha256"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "thoth-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/thoth.exe", README.md, LICENSE-MIT, LICENSE-APACHE $name
          Compress-Archive -Path "$name/*" -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"

      # the release itself is created once, by the publish job. Five build
      # jobs each writing it is what put five "Full Changelog" lines in the
      # notes of v0.3.0
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            thoth-*.tar.gz
            thoth-*.tar.gz.sha256
            thoth-*.zip
            thoth-*.zip.sha256
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the compare link

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Notes for this version, out of the changelog
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          # everything under "## [1.2.3]" up to the next "## [" heading.
          # index(...) == 1 is "starts with", which needs no escaping: as a
          # regex the version's dots and brackets would not mean themselves
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && index($0, "## [") == 1 { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          prev="$(git tag --sort=-v:refname | grep -vFx "$GITHUB_REF_NAME" | head -1)"
          if [ -n "$prev" ]; then
            printf '\n**Full changelog**: https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "$prev" "$GITHUB_REF_NAME" >> notes.md
          fi
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          # the notes are the changelog entry, written on purpose. Generated
          # ones would add a commit list nobody reads and a second compare link
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: dist/*
