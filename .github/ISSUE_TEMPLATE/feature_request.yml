name: Feature request
description: Something thoth should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do and where thoth got in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: How it could work. A rough idea is fine.
